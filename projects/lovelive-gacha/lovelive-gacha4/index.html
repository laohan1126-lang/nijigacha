<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LoveLive! 绯诲垪瑙掕壊鎶藉崱 鈥?渭's銆丄qours銆佽櫣鍜插鍥€丩iella! 鍏ㄨ鑹叉敹闆嗗浘閴?>
  <meta name="theme-color" content="#050a1f">
  <meta name="color-scheme" content="dark">
  <title>LoveLive! 瑙掕壊鍥鹃壌</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=20260418u">
</head>
<body>

  <audio id="bgm" loop preload="none" crossorigin="anonymous"></audio>

  <!-- 鍥涗釜瑙掕惤闊充箰鎸夐挳 -->
  <div class="corner-audio">
    <button class="corner-btn corner-mus" onclick="playGroupMusic('mus')" aria-label="鎾斁 渭's 闊充箰">渭's</button>
    <button class="corner-btn corner-aqours" onclick="playGroupMusic('aqours')" aria-label="鎾斁 Aqours 闊充箰">Aqours</button>
    <button class="corner-btn corner-niji" onclick="playGroupMusic('nijigasaki')" aria-label="鎾斁 铏瑰挷 闊充箰">铏瑰挷</button>
    <button class="corner-btn corner-liella" onclick="playGroupMusic('liella')" aria-label="鎾斁 Liella! 闊充箰">Liella!</button>
  </div>

  <!-- 棣栭〉 -->
  <section id="home-page" class="page active">
    <div class="home-bg"></div>
    <div class="home-content">
      <h1 class="home-title">LoveLive!</h1>
      <div class="group-row">
        <img src="./img/mus.jpg" alt="渭's" class="group-img" loading="lazy" decoding="async">
        <img src="./img/aqours.jpg" alt="Aqours" class="group-img" loading="lazy" decoding="async">
      </div>
      <div class="group-row">
        <img src="./img/nijigasaki.jpg" alt="铏瑰挷" class="group-img" loading="lazy" decoding="async">
        <img src="./img/liella.jpg" alt="Liella!" class="group-img" loading="lazy" decoding="async">
      </div>
      <label for="user-cn" class="sr-only">杈撳叆鏄电О</label>
      <input type="text" id="user-cn" class="home-input" placeholder="杈撳叆鏄电О 閫変綘鐨勮鑹? autocomplete="off">
      <button class="draw-btn" onclick="drawCardPro()">鎷夋媺浜轰笉鐏紒</button>
      <button class="draw-btn gallery-btn" onclick="switchPage('gallery-page')">馃摉 鍥鹃壌</button>
    </div>
  </section>

  <!-- 缁撴灉椤?-->
  <section id="result-page" class="page">
    <div class="result-container">
      <div class="user-info-banner">
        <span id="user-display-name">鍒朵綔浜?/span> 鎶藉埌浜嗭紒
      </div>
      <div class="char-modal" id="charModal">
        <div class="modal-header">
          <div class="avatar-wrapper">
            <img id="card-image" src="" alt="绔嬬粯" class="avatar">
            <div class="avatar-placeholder" id="art-placeholder">IMAGE</div>
          </div>
          <div class="info-wrapper">
            <h2 class="char-name" id="card-name">瑙掕壊鍚?/h2>
            <p class="char-subname" id="card-name-jp">鏃ユ枃鍚?/p>
            <p class="cv-info">CV: <span id="card-cv">澹颁紭</span></p>
            <div class="tags-container">
              <span class="tag" id="group-tag">鍥綋</span>
              <span class="tag" id="subunit-tag">subunit</span>
            </div>
          </div>
        </div>
        <div class="song-box">
          <button id="audio-btn" class="audio-btn" onclick="toggleAudio()" aria-label="鎾斁瑙掕壊姝屾洸"><svg viewBox="0 0 24 24" width="20" height="20"><path id="audio-icon-path" d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          <audio id="card-audio"></audio>
          <span id="card-song">姝屾洸</span>
        </div>
        <div class="section-title">瑙掕壊浠嬬粛</div>
        <p class="desc-text" id="card-personality"></p>
        <div class="quote-box">銆?span id="card-quote"></span>銆?/div>
        <div class="section-title">楂樺厜杞ㄨ抗</div>
        <p class="desc-text" id="card-hotstory"></p>
        <div class="trivia-box">
          <div class="section-title">灏忕煡璇?/div>
          <div id="card-trivia" class="desc-text"></div>
        </div>
        <div id="card-mv-box" class="mv-box">
          <a id="card-mv-link" class="mv-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </div>
    <button class="btn-back-home" onclick="backToHomePro()">杩斿洖棣栭〉</button>
  </section>

  <!-- 鍥鹃壌椤?-->
  <section id="gallery-page" class="page">
    <div class="gallery-header">
      <h2>馃摉 瑙掕壊鍥鹃壌</h2>
      <button class="btn-close" onclick="switchPage('home-page')" aria-label="鍏抽棴鍥鹃壌">鉁?/button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="script.js?v=20260419u"></script>
</body>
</html>
