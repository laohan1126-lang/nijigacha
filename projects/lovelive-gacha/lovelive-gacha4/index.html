<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LoveLive! 系列角色抽卡 — μ's、Aqours、虹咲学园、Liella! 全角色收集图鉴">
  <meta name="theme-color" content="#050a1f">
  <meta name="color-scheme" content="dark">
  <title>LoveLive! 角色图鉴</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=20260418u">
</head>
<body>

  <audio id="bgm" loop preload="none" crossorigin="anonymous"></audio>

  <!-- 四个角落音乐按钮 -->
  <div class="corner-audio">
    <button class="corner-btn corner-mus" onclick="playGroupMusic('mus')" aria-label="播放 μ's 音乐">μ's</button>
    <button class="corner-btn corner-aqours" onclick="playGroupMusic('aqours')" aria-label="播放 Aqours 音乐">Aqours</button>
    <button class="corner-btn corner-niji" onclick="playGroupMusic('nijigasaki')" aria-label="播放 虹咲 音乐">虹咲</button>
    <button class="corner-btn corner-liella" onclick="playGroupMusic('liella')" aria-label="播放 Liella! 音乐">Liella!</button>
  </div>

  <!-- 首页 -->
  <section id="home-page" class="page active">
    <div class="home-bg"></div>
    <div class="home-content">
      <h1 class="home-title">LoveLive!</h1>
      <div class="group-row">
        <img src="./img/mus.jpg" alt="μ's" class="group-img" loading="lazy" decoding="async">
        <img src="./img/aqours.jpg" alt="Aqours" class="group-img" loading="lazy" decoding="async">
      </div>
      <div class="group-row">
        <img src="./img/nijigasaki.jpg" alt="虹咲" class="group-img" loading="lazy" decoding="async">
        <img src="./img/liella.jpg" alt="Liella!" class="group-img" loading="lazy" decoding="async">
      </div>
      <label for="user-cn" class="sr-only">输入昵称</label>
      <input type="text" id="user-cn" class="home-input" placeholder="输入昵称 选你的角色" autocomplete="off">
      <button class="draw-btn" onclick="drawCardPro()">拉拉人不灭！</button>
      <button class="draw-btn gallery-btn" onclick="switchPage('gallery-page')">📖 图鉴</button>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="result-page" class="page">
    <div class="result-container">
      <div class="user-info-banner">
        <span id="user-display-name">制作人</span> 抽到了！
      </div>
      <div class="char-modal" id="charModal">
        <div class="modal-header">
          <div class="avatar-wrapper">
            <img id="card-image" src="" alt="立绘" class="avatar">
            <div class="avatar-placeholder" id="art-placeholder">IMAGE</div>
          </div>
          <div class="info-wrapper">
            <h2 class="char-name" id="card-name">角色名</h2>
            <p class="char-subname" id="card-name-jp">日文名</p>
            <p class="cv-info">CV: <span id="card-cv">声优</span></p>
            <div class="tags-container">
              <span class="tag" id="group-tag">团体</span>
              <span class="tag" id="subunit-tag">subunit</span>
            </div>
          </div>
        </div>
        <div class="song-box">
          <button id="audio-btn" class="audio-btn" onclick="toggleAudio()" aria-label="播放角色歌曲"><svg viewBox="0 0 24 24" width="20" height="20"><path id="audio-icon-path" d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          <audio id="card-audio"></audio>
          <span id="card-song">歌曲</span>
        </div>
        <div class="section-title">角色介绍</div>
        <p class="desc-text" id="card-personality"></p>
        <div class="quote-box">「<span id="card-quote"></span>」</div>
        <div class="section-title">高光轨迹</div>
        <p class="desc-text" id="card-hotstory"></p>
        <div class="trivia-box">
          <div class="section-title">小知识</div>
          <div id="card-trivia" class="desc-text"></div>
        </div>
        <div id="card-mv-box" class="mv-box">
          <a id="card-mv-link" class="mv-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </div>
    <button class="btn-back-home" onclick="backToHomePro()">返回首页</button>
  </section>

  <!-- 图鉴页 -->
  <section id="gallery-page" class="page">
    <div class="gallery-header">
      <h2>📖 角色图鉴</h2>
      <button class="btn-close" onclick="switchPage('home-page')" aria-label="关闭图鉴">✕</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="script.js?v=20260418u"></script>
</body>
</html>
