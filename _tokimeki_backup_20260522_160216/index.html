<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8f7f0" />
  <title>虎子的小鹿社｜鹿出来了</title>
  <meta name="description" content="此刻悄然而生的 tokimeki。鹿出来了。热爱是一切的理由和答案。" />
  <link rel="preload" href="assets/tokimeki.css" as="style" />
  <link rel="stylesheet" href="assets/tokimeki.css" />
</head>
<body>
  <noscript>
    <div class="noscript">这个页面需要启用 JavaScript 才能渲染左侧项目导航。</div>
  </noscript>

  <div class="app-shell" id="appShell" data-sidebar="expanded" data-mobile-nav="closed">
    <aside class="sidebar" id="sidebar" aria-label="项目导航">
      <div class="sidebar-head">
        <a class="brand" href="/" aria-label="返回虎子的小鹿社首页">
          <span class="brand-emblem" aria-hidden="true">🦌</span>
          <span class="brand-text">
            <span class="brand-title">虎子的小鹿社</span>
            <span class="brand-subtitle">tokimeki</span>
          </span>
        </a>

        <button class="icon-button sidebar-collapse" id="sidebarCollapse" type="button" aria-label="折叠侧边栏" aria-expanded="true">
          <span aria-hidden="true">‹‹</span>
        </button>

        <button class="icon-button mobile-close" id="mobileClose" type="button" aria-label="关闭导航">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <label class="search-field" for="projectSearch">
        <span aria-hidden="true">⌕</span>
        <input id="projectSearch" type="search" autocomplete="off" placeholder="搜索项目" />
      </label>

      <nav class="nav-list" id="projectNav" aria-label="项目分类列表"></nav>

      <div class="sidebar-foot">
        <button class="sidebar-inline-action" type="button" aria-label="设置">
          <span aria-hidden="true">⚙</span>
          <span>设置</span>
        </button>
        <button class="sidebar-inline-action" type="button" aria-label="浅色模式">
          <span aria-hidden="true">☾</span>
          <span>浅色模式</span>
        </button>
      </div>
    </aside>

    <button class="rail-expand" id="railExpand" type="button" aria-label="展开侧边栏">
      <span aria-hidden="true">›</span>
    </button>

    <div class="mobile-overlay" id="mobileOverlay" hidden></div>

    <main class="main-stage" aria-labelledby="heroTitle">
      <header class="desktop-topbar" aria-label="顶部快捷操作">
        <div class="utility-actions">
          <button class="icon-button utility-icon" type="button" aria-label="搜索"><span aria-hidden="true">⌕</span></button>
          <button class="icon-button utility-icon" type="button" aria-label="通知"><span aria-hidden="true">◌</span></button>
          <button class="avatar-chip" type="button" aria-label="个人中心">
            <span class="avatar-dot" aria-hidden="true"></span>
            <span class="avatar-caret" aria-hidden="true">⌄</span>
          </button>
        </div>
      </header>

      <header class="mobile-topbar">
        <button class="icon-button" id="mobileMenu" type="button" aria-label="打开项目导航">
          <span aria-hidden="true">☰</span>
        </button>
        <div class="mobile-brand">
          <span class="mobile-brand-icon" aria-hidden="true">🦌</span>
          <span class="mobile-title">虎子的小鹿社</span>
        </div>
        <div class="mobile-topbar-actions" aria-hidden="true">
          <span>◌</span>
          <span class="mobile-avatar"></span>
        </div>
      </header>

      <section class="hero-card">
        <p class="hero-kicker" id="heroKicker">此刻悄然而生的 tokimeki</p>
        <div class="hero-divider" aria-hidden="true"><span></span><i>✦</i><span></span></div>
        <div class="hero-visual-wrap">
          <div class="hero-glow"></div>
          <div class="logo-frame" aria-label="站点 Logo 区域">
            <img id="heroLogo" src="assets/deer-pipe-logo.png" alt="鹿出来了主视觉形象" />
          </div>
        </div>
        <h1 id="heroTitle">鹿出来了</h1>
      </section>

      <p class="bottom-motto" id="bottomMotto">热爱是一切的理由和答案</p>
    </main>
  </div>

  <script src="assets/tokimeki.js" defer></script>
</body>
</html>
